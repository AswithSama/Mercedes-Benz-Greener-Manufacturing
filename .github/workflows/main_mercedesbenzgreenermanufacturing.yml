# Data-free continuous integration. Cloud deployment remains a separate,
# intentionally unverified step and is not triggered by repository pushes.
name: Mercedes-Benz pipeline checks

on:
  push:
    branches: [main, Main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run data-free training and Flask tests
        run: python -m pytest -q
